<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Parking WMoura</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>QR Parking WMoura</h1>
            <p>Desenvolvido por Wesley Moura</p>
        </header>

        <div class="control-panel">
            <button onclick="registrarEntrada()" class="action-button">Registrar Entrada</button>
            <button onclick="registrarSaida()" class="action-button">Registrar Saída</button>
        </div>

        <div id="saida-container" class="info-card hidden">
            <h3>Detalhes da Saída</h3>
            <p id="info-saida"></p>
            <div id="qrcode" class="qrcode-wrapper"></div>
        </div>

        <div class="history-section">
            <button onclick="toggleHistorico()" id="historico-toggle" class="toggle-button">Mostrar Histórico do Dia</button>
            <div id="historico-container" class="info-card hidden">
                <h3>Histórico do Dia</h3>
                <table id="historico-tabela">
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Entrada</th>
                            <th>Saída</th>
                            <th>Tempo (min)</th>
                            <th>Valor (R$)</th>
                        </tr>
                    </thead>
                    <tbody id="historico-corpo"></tbody>
                </table>
                <h4>Carros ainda no estacionamento</h4>
                <table id="ativos-tabela">
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Entrada</th>
                            <th>Saída</th>
                            <th>Tempo (min)</th>
                            <th>Valor (R$)</th>
                        </tr>
                    </thead>
                    <tbody id="ativos-corpo"></tbody>
                </table>
                <button onclick="limparHistorico()" id="limpar-historico" class="clear-button">Limpar Histórico do Dia</button>
            </div>
        </div>

        <footer>
            <p>Siga-me nas redes sociais:</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/wesley-moura-569802191/" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/wesmoura" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://www.instagram.com/wesguit?igsh=M2E4bGhkbzk5bzg5" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/5547988508092" target="_blank"><i class="fab fa-whatsapp"></i></a>
            </div>
            <p class="signature">Desenvolvido por Wesley Moura</p>
        </footer>
    </div>
</body>
</html>
